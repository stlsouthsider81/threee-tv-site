title: TV3
description: TV3
baseurl: ""
url: ""

markdown: kramdown
theme: null
plugins: []

collections:
  shows:
    output: true
    permalink: /s/:path/

defaults:
  - scope:
      path: ""
      type: "shows"
    values:
      layout: "show"

# ---- Per-environment settings (prod values) ---------------------------------
# Dev values live in _config.dev.yml, layered over this file. The dev stack
# (threetv-prod, SITE=1) builds with both; so can a local `jekyll serve`:
#   bundle exec jekyll serve --config _config.yml,_config.dev.yml

# HLS stream URL.
stream_url: "https://cdn.threee.tv/hls/stream.m3u8"

# Schedule API (now-playing overlay + daily lineup).
schedule_api: "https://api-stream.threee.tv"

# Web app login (the "Chat" button).
app_url: "https://app.threee.tv/login"

# iOS app on the App Store (header badge + show page "Get the App" buttons).
app_store_url: "https://apps.apple.com/us/app/threee-tv/id6762097424"
