<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-PSM7B9GF');</script>
  <!-- End Google Tag Manager -->
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PSM7B9GF"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <header>
    <a href="/" class="logo">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="TV3">
    </a>
  </header>
  <div class="video-container">
    <video id="video" autoplay muted playsinline></video>
    <div id="loader" class="loader">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="">
    </div>
  </div>
  <button id="mute-btn" class="mute-btn" type="button" aria-label="Unmute" aria-pressed="true">
    <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M11 5 6 9H2v6h4l5 4V5z"/>
      <path d="M23 9l-6 6M17 9l6 6" stroke-linecap="round"/>
    </svg>
    <svg class="icon-unmuted" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M11 5 6 9H2v6h4l5 4V5z"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14" fill="none" stroke-linecap="round"/>
    </svg>
  </button>
  <a href="https://apps.apple.com/us/app/threee-tv/id6762097424" class="app-store-badge" aria-label="Download on the App Store" target="_blank" rel="noopener noreferrer">
    <img src="{{ '/assets/images/app-store-badge.svg' | relative_url }}" alt="Download on the App Store" width="150" height="50">
  </a>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    var video = document.getElementById('video');
    if (video) {
      var loader = document.getElementById('loader');
      var showLoader = function () { if (loader) loader.classList.remove('hidden'); };
      var hideLoader = function () { if (loader) loader.classList.add('hidden'); };
      var src = 'https://cdn.threee.tv/hls/stream.m3u8';
      if (Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(src);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
      }
      video.addEventListener('playing', hideLoader);
      video.addEventListener('canplay', hideLoader);
      video.addEventListener('waiting', showLoader);
      video.addEventListener('stalled', showLoader);
      video.addEventListener('error', showLoader);
      video.addEventListener('pause', function() {
        video.play();
      });

      var muteBtn = document.getElementById('mute-btn');
      var syncMuteBtn = function () {
        muteBtn.classList.toggle('is-muted', video.muted);
        muteBtn.setAttribute('aria-pressed', String(video.muted));
        muteBtn.setAttribute('aria-label', video.muted ? 'Unmute' : 'Mute');
      };
      muteBtn.addEventListener('click', function () {
        video.muted = !video.muted;
        syncMuteBtn();
        showControls();
      });
      video.addEventListener('volumechange', syncMuteBtn);
      syncMuteBtn();

      // Fade the controls away after a period of inactivity.
      var hideTimer;
      var showControls = function () {
        document.body.classList.remove('controls-hidden');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
          document.body.classList.add('controls-hidden');
        }, 3000);
      };
      ['pointermove', 'pointerdown', 'touchstart', 'keydown'].forEach(function (evt) {
        document.addEventListener(evt, showControls, { passive: true });
      });
      showControls();
    }
  </script>
</body>
</html>
